<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Strona Czerwona</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASJC" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Biblioteka w3.js do inkludowania menu -->
    <script src="https://www.w3schools.com/lib/w3.js"></script>
</head>
<body style="background-color: #ffebee; min-height: 100vh;">

    <!-- Wstrzyknięcie menu przez w3-include-html -->
    <div w3-include-html="menu.html"></div>

    <div class="container my-5">
        <h1 class="text-danger mb-4">
            <i class="bi bi-table me-2"></i>Strona Czerwona - Tabela ocen (Bootstrap 5)
        </h1>
        <p class="lead">Poniższa tabela z laboratorium 1 została sformatowana przy użyciu gotowych klas frameworka Bootstrap.</p>

        <div class="table-responsive shadow-sm bg-white p-3 rounded">
            <table class="table table-striped table-hover table-bordered align-middle">
                <thead class="table-danger">
                    <tr>
                        <th scope="col"><i class="bi bi-person-fill me-1"></i>Nazwisko</th>
                        <th scope="col"><i class="bi bi-person me-1"></i>Imię</th>
                        <th scope="col" class="text-center"><i class="bi bi-award-fill me-1"></i>Ocena</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Kowalski</td>
                        <td>Jan</td>
                        <td class="text-center fw-bold text-success">5.0</td>
                    </tr>
                    <tr>
                        <td>Nowak</td>
                        <td>Anna</td>
                        <td class="text-center fw-bold text-primary">4.5</td>
                    </tr>
                    <tr>
                        <td>Wiśniewski</td>
                        <td>Piotr</td>
                        <td class="text-center fw-bold text-warning">3.0</td>
                    </tr>
                    <tr>
                        <td>Zielińska</td>
                        <td>Katarzyna</td>
                        <td class="text-center fw-bold text-info">3.5</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <script>
        w3.includeHTML();
    </script>
</body>
</html>
